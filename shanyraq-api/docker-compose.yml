version: '3.8'

services:
  app:
    build: .
    container_name: express_ts_app
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - mongo
    environment:
      MONGO_URI: ${MONGO_URI}
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules 
    command: npm run start:prod  

  mongo:
    image: mongo:6.0
    container_name: mongo_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_SECRET}

volumes:
  mongo_data:
